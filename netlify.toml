[build]
  command = "bash build.sh"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  # Keep the Cargo registry/git caches inside the repo so the cache plugin
  # persists them between builds.
  CARGO_HOME = "/opt/build/repo/.cargo"

# Cache the Rust registry and build output to avoid cold rebuilds of the
# image/syntect-heavy dependency tree on every deploy.
[[plugins]]
  package = "netlify-plugin-cache"

  [plugins.inputs]
    paths = [".cargo", "ssg/target"]
