name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ssg
      - run: npm ci
      - name: Rust format
        run: cargo fmt --manifest-path ssg/Cargo.toml --check
      - name: Rust clippy
        run: cargo clippy --manifest-path ssg/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path ssg/Cargo.toml
      - name: Build site
        run: cargo run --release --locked --manifest-path ssg/Cargo.toml
        env:
          SSG_ROOT: ${{ github.workspace }}
      - name: Lint content
        run: npm test
