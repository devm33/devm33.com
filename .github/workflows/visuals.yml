name: Visuals
on: [push]

# Serialize with the auto-formatting workflow so their auto-commits don't race.
concurrency:
  group: auto-commit-${{ github.ref }}

jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ssg
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build site
        run: cargo run --release --locked --manifest-path ssg/Cargo.toml
        env:
          SSG_ROOT: ${{ github.workspace }}
      - name: Generate resume PDF
        run: npm run resume-pdf
      - name: Capture screenshots
        run: npm run screenshots
      - name: Commit regenerated visuals
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Regenerate resume PDF and screenshots
          file_pattern: static/devraj_mehta_resume.pdf screenshots/
