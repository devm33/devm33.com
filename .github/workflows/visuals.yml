name: Visuals
on: [push]

# Serialize with the auto-formatting workflow (same group) so their auto-commits
# never push concurrently. The key must be stable across push/pull_request
# events, so it uses the branch name rather than github.ref.
concurrency:
  group: auto-commit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  visuals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch tip by name so that, once serialized after the
          # format job, we build on top of whatever it just pushed (fast-forward).
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ssg
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build site
        run: cargo run --release --locked --manifest-path ssg/Cargo.toml
        env:
          SSG_ROOT: ${{ github.workspace }}
      - name: Generate resume PDF
        run: npm run resume-pdf
      - name: Capture screenshots
        run: npm run screenshots
      - name: Commit regenerated visuals
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Regenerate resume PDF and screenshots
          file_pattern: static/devraj_mehta_resume.pdf screenshots/
