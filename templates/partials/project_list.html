{% macro project_list(projects) %}
{% for p in projects %}
<div class="project">
  <a class="thumbnail" href="{{ p.path }}" aria-label="{{ p.title }}">
    {% if p.image %}<img src="{{ p.path }}{{ p.image }}" alt="" />{% endif %}
  </a>
  <header>
    <h1><a href="{{ p.path }}">{{ p.title }}</a>
      {% if p.repo %}<a href="{{ p.repo }}">Source</a>{% endif %}
      {% if p.link %}<a href="{{ p.link }}">Link</a>{% endif %}
    </h1>
    <div class="subtitle">
      <i>Updated {{ p.updated }}</i>
      <div class="pill-group">
        {% for t in p.tags %}<a class="pill" href="{{ t.href }}">{{ t.name }}</a>{% endfor %}
      </div>
    </div>
    <div class="tagline">{{ p.tagline }}</div>
  </header>
</div>
{% endfor %}
{% endmacro project_list %}
